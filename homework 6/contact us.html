    <script>
        function checkit() {
            if (document.getElementById("Firstname").value == "") {
                document.getElementById("Firstname").style.backgroundColor = "red" 
                document.getElementById("required").innerHTML = "* Required"
            }
            if (document.getElementById("emailaddress").value=="") {
                document.getElementById("emailaddress").style.backgroundColor = "red"
                document.getElementById("required2").innerHTML = "* Required"
            }

        }
    </script>
    <body>
        <h1>Contact us if you need any support with the website if not working properly</h1>
        <form action="index.html" type="Post">
            First and last name:<br><input type="text" Id="Firstname"> <span id="required"></span>
            <br> Email address:<br><input type="text" id="emailaddress"> <span id="required2"></span>
            <br>Yes <input type="radio" name="I AGREE" value="yes">
            <br>No <input type="radio" name="I AGREE" value="no">
            <br> <button type="button" onclick="checkit()">Submit</button>
        </form>

    </body>
